
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Paint - Estúdio de Desenho</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f6;
    color: #263247;
}

header {
    background: #263b65;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
}

nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    background: white;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    background: #e0e7f3;
    color: #263b65;
    font-weight: bold;
}

button:hover {
    background: #c6d5ed;
}

button.active {
    background: #4169ad;
    color: white;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 15px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.toolbar label {
    font-size: 13px;
    font-weight: bold;
}

input[type="color"] {
    width: 45px;
    height: 35px;
    border: none;
    cursor: pointer;
}

input[type="range"] {
    width: 100px;
}

.canvas-area {
    background: white;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #0001;
    overflow: auto;
}

canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    background: white;
    border: 1px solid #ddd;
    touch-action: none;
    cursor: crosshair;
}

#gallery {
    display: none;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

.drawing-card {
    background: white;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 10px #0001;
}

.drawing-card img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    background: #fafafa;
}

.drawing-card h3 {
    margin: 10px;
}

.drawing-card button {
    width: 100%;
    background: #4169ad;
    color: white;
}

#editor h2, #gallery h2 {
    margin-top: 0;
}

footer {
    text-align: center;
    padding: 20px;
    color: #718096;
}
</style>
</head>

<body>

<header>
    <h1>🎨 Mini Paint</h1>
    <p>Desenhe, pinte e solte sua criatividade!</p>
</header>

<nav>
    <button id="tabPaint" class="active" onclick="showTab('paint')">
        🖌️ Desenho Livre
    </button>

    <button id="tabGallery" onclick="showTab('gallery')">
        🖼️ Desenhos para Colorir
    </button>
</nav>

<div class="container">

<section id="editor">

    <h2>Área de desenho</h2>

    <div class="toolbar">

        <label>Ferramenta</label>

        <select id="tool">
            <option value="brush">Pincel</option>
            <option value="eraser">Borracha</option>
            <option value="line">Linha</option>
            <option value="rectangle">Retângulo</option>
            <option value="circle">Círculo</option>
            <option value="fill">Balde de tinta</option>
        </select>

        <label>Cor</label>
        <input type="color" id="color" value="#000000">

        <label>Espessura</label>
        <input type="range" id="size" min="1" max="40" value="5">

        <button onclick="undo()">↶ Desfazer</button>
        <button onclick="redo()">↷ Refazer</button>
        <button onclick="clearCanvas()">🗑 Limpar</button>
        <button onclick="saveImage()">💾 Salvar PNG</button>

    </div>

    <div class="canvas-area">
        <canvas id="canvas" width="1100" height="650"></canvas>
    </div>

</section>

<section id="gallery">

    <h2>Escolha um desenho para colorir!</h2>
    <p>Selecione um modelo e comece a pintar.</p>

    <div class="gallery-grid" id="drawingGrid"></div>

</section>

</div>

<footer>
    Mini Paint © 2026 - Crie sua própria arte!
</footer>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let startX = 0;
let startY = 0;
let snapshot = null;

let undoStack = [];
let redoStack = [];

ctx.lineCap = "round";
ctx.lineJoin = "round";

function saveState() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

    if (undoStack.length > 30) {
        undoStack.shift();
    }

    redoStack = [];
}

function undo() {
    if (!undoStack.length) return;

    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

    ctx.putImageData(undoStack.pop(), 0, 0);
}

function redo() {
    if (!redoStack.length) return;

    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

    ctx.putImageData(redoStack.pop(), 0, 0);
}

function getPosition(e) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
    };
}

function getSettings() {
    return {
        tool: document.getElementById("tool").value,
        color: document.getElementById("color").value,
        size: Number(document.getElementById("size").value)
    };
}

canvas.addEventListener("pointerdown", startDrawing);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("pointerleave", stopDrawing);

function startDrawing(e) {
    if (e.button !== undefined && e.button !== 0) return;

    e.preventDefault();

    const pos = getPosition(e);
    const settings = getSettings();

    if (settings.tool === "fill") {
        saveState();
        floodFill(
            Math.floor(pos.x),
            Math.floor(pos.y),
            hexToRgba(settings.color)
        );
        return;
    }

    saveState();

    drawing = true;
    startX = pos.x;
    startY = pos.y;

    if (settings.tool === "brush" || settings.tool === "eraser") {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineWidth = settings.size;
        ctx.strokeStyle = settings.tool === "eraser"
            ? "#ffffff" : settings.color;
        ctx.globalCompositeOperation = "source-over";
        ctx.lineTo(pos.x + 0.1, pos.y);
        ctx.stroke();
    } else {
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    canvas.setPointerCapture(e.pointerId);
}

function draw(e) {
    if (!drawing) return;

    e.preventDefault();

    const pos = getPosition(e);
    const settings = getSettings();

    if (settings.tool === "brush" || settings.tool === "eraser") {
        ctx.lineWidth = settings.size;
        ctx.strokeStyle = settings.tool === "eraser"
            ? "#ffffff" : settings.color;

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();

        startX = pos.x;
        startY = pos.y;

    } else if (snapshot) {
        ctx.putImageData(snapshot, 0, 0);

        ctx.lineWidth = settings.size;
        ctx.strokeStyle = settings.color;

        ctx.beginPath();

        if (settings.tool === "line") {
            ctx.moveTo(startX, startY);
            ctx.lineTo(pos.x, pos.y);
        }

        if (settings.tool === "rectangle") {
            ctx.rect(
                startX,
                startY,
                pos.x - startX,
                pos.y - startY
            );
        }

        if (settings.tool === "circle") {
            const radius = Math.hypot(
                pos.x - startX,
                pos.y - startY
            );

            ctx.arc(startX, startY, radius, 0, Math.PI * 2);
        }

        ctx.stroke();
    }
}

function stopDrawing() {
    drawing = false;
    snapshot = null;
}

function clearCanvas() {
    if (!confirm("Deseja apagar todo o desenho?")) return;

    saveState();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function saveImage() {
    const link = document.createElement("a");
    link.download = "meu-desenho.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}

function hexToRgba(hex) {
    return [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16),
        255
    ];
}

// Ferramenta balde de tinta
function floodFill(startX, startY, fillColor) {
    const image = ctx.getImageData(
        0, 0, canvas.width, canvas.height
    );

    const data = image.data;
    const width = canvas.width;
    const height = canvas.height;

    const startIndex = (startY * width + startX) * 4;

    const target = [
        data[startIndex],
        data[startIndex + 1],
        data[startIndex + 2],
        data[startIndex + 3]
    ];

    if (target.every((v, i) => v === fillColor[i])) return;

    const tolerance = 25;

    function matches(index) {
        return (
            Math.abs(data[index] - target[0]) <= tolerance &&
            Math.abs(data[index + 1] - target[1]) <= tolerance &&
            Math.abs(data[index + 2] - target[2]) <= tolerance &&
            Math.abs(data[index + 3] - target[3]) <= tolerance
        );
    }

    const stack = [[startX, startY]];
    const visited = new Uint8Array(width * height);

    while (stack.length) {
        const [x, y] = stack.pop();

        if (x < 0 || y < 0 || x >= width || y >= height) continue;

        const pixel = y * width + x;

        if (visited[pixel]) continue;

        visited[pixel] = 1;

        const index = pixel * 4;

        if (!matches(index)) continue;

        data[index] = fillColor[0];
        data[index + 1] = fillColor[1];
        data[index + 2] = fillColor[2];
        data[index + 3] = fillColor[3];

        stack.push(
            [x + 1, y],
            [x - 1, y],
            [x, y + 1],
            [x, y - 1]
        );
    }

    ctx.putImageData(image, 0, 0);
}

// Navegação entre abas
function showTab(tab) {
    document.getElementById("editor").style.display =
        tab === "paint" ? "block" : "none";

    document.getElementById("gallery").style.display =
        tab === "gallery" ? "block" : "none";

    document.getElementById("tabPaint").classList.toggle(
        "active", tab === "paint"
    );

    document.getElementById("tabGallery").classList.toggle(
        "active", tab === "gallery"
    );
}

// Desenhos predefinidos em SVG
const drawings = [
    {
        name: "Gatinho",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <g fill="white" stroke="black" stroke-width="5" stroke-linejoin="round">
        <path d="M75 110 L70 35 L130 75 Q150 65 170 75 L230 35 L225 110 Q260 160 230 220 Q200 270 150 270 Q100 270 70 220 Q40 160 75 110Z"/>
        <ellipse cx="115" cy="145" rx="10" ry="16"/>
        <ellipse cx="185" cy="145" rx="10" ry="16"/>
        <path d="M140 180 Q150 195 160 180 M150 190 L150 205 M150 205 Q130 220 120 205 M150 205 Q170 220 180 205" fill="none"/>
        </g></svg>`
    },
    {
        name: "Borboleta",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <g fill="white" stroke="black" stroke-width="5">
        <path d="M145 145 Q80 10 30 75 Q-5 160 135 180 Q45 280 105 270 Q145 250 150 190Z"/>
        <path d="M155 145 Q220 10 270 75 Q305 160 165 180 Q255 280 195 270 Q155 250 150 190Z"/>
        <ellipse cx="150" cy="160" rx="12" ry="75"/>
        <path d="M145 90 Q110 35 105 40 M155 90 Q190 35 195 40" fill="none"/>
        </g></svg>`
    },
    {
        name: "Flor",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <g fill="white" stroke="black" stroke-width="5">
        <circle cx="150" cy="115" r="35"/>
        <circle cx="150" cy="55" r="35"/>
        <circle cx="210" cy="115" r="35"/>
        <circle cx="150" cy="175" r="35"/>
        <circle cx="90" cy="115" r="35"/>
        <circle cx="150" cy="115" r="23"/>
        <path d="M150 175 L150 280 M150 230 Q90 185 85 230 Q110 260 150 250 M150 245 Q205 190 220 230 Q190 265 150 260" />
        </g></svg>`
    },
    {
        name: "Casinha",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <g fill="white" stroke="black" stroke-width="5" stroke-linejoin="round">
        <path d="M35 135 L150 35 L265 135 L245 135 L245 270 L55 270 L55 135Z"/>
        <rect x="125" y="180" width="55" height="90"/>
        <rect x="75" y="150" width="35" height="35"/>
        <rect x="190" y="150" width="35" height="35"/>
        </g></svg>`
    },
    {
        name: "Peixinho",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <g fill="white" stroke="black" stroke-width="5">
        <path d="M45 150 Q120 55 225 150 Q120 245 45 150Z"/>
        <path d="M225 150 L275 95 L275 205Z"/>
        <circle cx="100" cy="130" r="8"/>
        <path d="M145 150 Q170 120 185 150 Q170 180 145 150Z"/>
        </g></svg>`
    },
    {
        name: "Coração",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <path d="M150 265 C110 225 30 165 30 105 C30 20 135 15 150 90 C165 15 270 20 270 105 C270 165 190 225 150 265Z" fill="white" stroke="black" stroke-width="6"/>
        </svg>`
    }
];

// Montagem da galeria
const grid = document.getElementById("drawingGrid");

drawings.forEach((drawing, index) => {
    const card = document.createElement("div");
    card.className = "drawing-card";

    const img = document.createElement("img");
    img.alt = drawing.name;
    img.src = "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(drawing.svg);

    const title = document.createElement("h3");
    title.textContent = drawing.name;

    const button = document.createElement("button");
    button.textContent = "🎨 Colorir desenho";

    button.onclick = () => loadDrawing(index);

    card.append(img, title, button);
    grid.appendChild(card);
});

function loadDrawing(index) {
    const drawing = drawings[index];

    const image = new Image();

    image.onload = () => {
        saveState();

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const scale = Math.min(
            (canvas.width - 100) / image.width,
            (canvas.height - 100) / image.height
        );

        const width = image.width * scale;
        const height = image.height * scale;

        ctx.drawImage(
            image,
            (canvas.width - width) / 2,
            (canvas.height - height) / 2,
            width,
            height
        );

        showTab("paint");
    };

    image.src = "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(drawing.svg);
}

// Inicialização
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, canvas.width, canvas.height);

</script>

</body>
</html>
